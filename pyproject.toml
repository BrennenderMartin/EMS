[project]
name = "ems"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Mattis Jung", email = "mattis2612@outlook.de" }
]
dependencies = [
    "pandas>=3.1.1",
    "peewee>=4.5.3",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.rye.scripts]
main = "python -m src.ems.main"
db  = "rye run python -m ems.database.crud"
dataloader = "rye run python -m ems.data_loader"
ems = "python -m src.ems.ems"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ems"]
